name: Backup Master Only

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup git identity
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Push to backup repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote remove back || true
          git remote add back https://x-access-token:$TOKEN@github.com/qshopn/back-repo.git
          git push back master
