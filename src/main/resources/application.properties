# ==============================
# NeonDB PostgreSQL Configuration (Active for production)
# ==============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
logging.level.org.hibernate.engine.transaction.jta.platform.internal=ERROR
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000


# ==============================
# Cloudflare R2 Configuration
# ==============================

cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.bucket=${R2_BUCKET}
cloudflare.r2.public-url=${R2_PUBLIC_URL}

# ===============================
# SENDGRID CORE CONFIG
# ===============================

sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}
sendgrid.replyto.email=${SENDGRID_REPLYTO_EMAIL}


# ===============================
# SENDGRID TEMPLATE IDS
# ===============================

sendgrid.otp.template-id=${SENDGRID_OTP_TEMPLATE}
sendgrid.order.info.template-id=${SENDGRID_ORDER_TEMPLATE}
sendgrid.owner.welcome.template-id=${SENDGRID_OWNER_TEMPLATE}
sendgrid.support.ticket.template-id=${SENDGRID_SUPPORT_TEMPLATE}
sendgrid.subscription.alert.template-id=${SENDGRID_SUBSCRIPTION_TEMPLATE}
sendgrid.attachment.template-id=${SENDGRID_ATTACHMENT_TEMPLATE}

# ===============================
# CLEAN LOGGING (PRO LEVEL)
# ===============================

# Show only important logs (reduce noise)
logging.level.org.springframework=WARN

# Hibernate logs (disable SQL completely)
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# Only show Hibernate errors
logging.level.org.hibernate=ERROR

# Your application logs (keep visible)
logging.level.com.synix=INFO

# Multipart file upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Log all incoming HTTP requests
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D

# File upload base directory
file.upload-dir=uploads

#Live credentials
razorpay.api.key=${RAZORPAY_KEY}
razorpay.api.secret=${RAZORPAY_SECRET}

management.endpoint.health.show-details=always

# Enable actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus

# Enable Prometheus
management.endpoint.prometheus.enabled=true

# Filter metrics by name
management.metrics.export.simple.enabled=true
management.metrics.enable.process_cpu_usage=true
management.metrics.enable.system_cpu_usage=true
management.metrics.enable.jvm_memory=true
management.metrics.enable.jvm_threads=true
management.metrics.enable.jvm_gc=true
management.metrics.enable.disk=true
management.metrics.enable.executor=true
management.metrics.enable.http_server_requests=true
management.metrics.enable.tomcat=true
management.metrics.enable.hikaricp=true
management.metrics.enable.cache=true
